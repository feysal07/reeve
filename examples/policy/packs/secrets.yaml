# Secrets: reading credential files, and printing secrets to the agent's context.
#
# The baseline's secrets rules, as a pack an organisation can adopt without the rest of
# the baseline. Kept identical to the baseline's rules by a test, so the two cannot drift
# apart: a fix to one that missed the other would leave whichever was adopted weaker.
version: 1
name: secrets
default: allow

rules:
  - id: read-secrets
    description: Reading credential files
    decision: deny
    reason: >-
      This file usually holds credentials. An agent that reads it can repeat the
      contents into a prompt, a commit or a tool call, and you would not see it
      happen. Read the value yourself and pass only what is needed.
    match:
      kind: [read]
      path:
        - "**/.env"
        - "**/.env.*"
        - "**/.ssh/**"
        - "**/.aws/credentials"
        - "**/.kube/config"
        - "**/id_rsa"
        - "**/id_ed25519"
        - "**/*.pem"
        - "**/*.p12"
        - "**/*.keystore"

  # Ask, for the same reason as destructive-delete below: these patterns are
  # substrings, and ".env" appears in commands that are reading a policy file,
  # writing a test fixture or editing documentation. Reading a credential really
  # is worth stopping, so tighten this to deny once you have replayed your own
  # log and know what it costs.
  - id: print-secrets
    description: Printing credential files through a shell command
    decision: ask
    reason: >-
      Reading a credential file through the shell bypasses a file-read rule while
      having exactly the same effect.
    #
    # ".env" as a path rather than as a substring: found in a real decision log, the
    # bare substring asked about every os.environ in an inline Python script. The
    # forms below need it to follow a space, a separator or a quote, which a file
    # name does and an attribute does not. It still asks about .env.example, which
    # is usually a template and sometimes holds real values; check it.
    match:
      kind: [shell]
      commandRuns:
        - " .env"
        - "/.env"
        - '\.env'
        - '".env'
        - "'.env"
        - "id_rsa"
        - ".aws/credentials"
        - ".kube/config"

  # ------------------------------------------------------------ destructive ----

  # Ask rather than deny, and that is a measured decision rather than a cautious
  # one. Replayed against fourteen hours of one developer's real work, this rule
  # matched twenty-five times, every one of them a deliberate clean-up of a
  # scratch directory. A deny at that rate is not a control, because it gets
  # removed within a day and takes the rest of the policy with it.
  #
  # If your fleet does not work that way, make it a deny — but measure first:
  #
  #   reeve policy replay ./decisions.jsonl --policy your-baseline.yaml
