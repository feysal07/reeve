    action: {kind: write, paths: ["/r/src/test/java/acme/OrderServiceIT.java"], editContent: "@Autowired\nprivate PaymentClient payments;"}
    expect: {effect: allow}
  - name: '@MockBean in production code is not this pack''s concern'
