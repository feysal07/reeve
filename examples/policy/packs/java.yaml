# Java services with a managed database schema.
#
# Written for Spring Boot services using Liquibase or Flyway, which is where an agent
# does the most damage with the least warning. An applied changeset is part of the
# database's history: edit it and the next deployment fails checksum validation, or -
# with validation off - silently diverges from every environment it already ran in. The
# fix an agent reaches for is to edit the changeset that is failing, because that is
# the file in front of it.
version: 1
name: java
default: allow

rules:
  - id: edit-applied-migration
    description: Editing a database changeset or migration
    decision: ask
    reason: >-
      A changeset that has run anywhere is part of that database's history. Editing
      it breaks checksum validation on the next deployment. Appending a new changeset
      to the end of the file is fine; changing one that has already run is not.
    # Still asks on every edit to these files, because whether an edit appends a new
    # changeset or changes an old one is not visible from the action. Measured on a
    # tester's five days of real work: five asks, all edits to the cumulative
    # release changelog, which is the file where both happen.
    match:
      kind: [write]
      path:
        - "**/db/changelog/**"
        - "**/db/migration/**"

  - id: drop-schema
    description: Dropping every object in a schema
    decision: deny
    reason: >-
      This drops everything in the schema the tool is pointed at, and the tool does
      not ask which one that is.
    match:
      kind: [shell]
      commandRuns:
        - "flyway clean"
        - "flyway:clean"
        - "liquibase dropAll"
        - "liquibase drop-all"
        - "liquibase:dropAll"

  - id: skip-verification
    description: Building without running the tests or checks
    decision: ask
    reason: >-
      This builds an artefact without the tests or checks that would have caught the
      problem. Fine for a quick local compile; not for anything that gets installed,
      published or committed.
    # Only with a goal that produces, installs, publishes or deploys something.
    # Measured on a tester's five days of real work: the flag alone would have asked
    # twenty-three times, and fourteen of those were compile or test-compile, which run
    # no tests whatever the flag says. A prompt on those is noise, and noise gets a
    # rule removed. The leading spaces keep a directory such as build-tools from
    # counting as a goal.
    match:
      kind: [shell]
      commandContains: &artefact-goals
        - " install"
        - " package"
        - " verify"
        - " deploy"
        - " publish"
        - " build"
        - " check"
      commandRuns:
        - "-DskipTests"
        - "-Dmaven.test.skip"
        - "-Dcheckstyle.skip"
        - "-Dspotbugs.skip"
        - "-Djacoco.skip"
        # With the trailing space: a bare "-x test" also matched curl's proxy flag,
        # as in curl -x test-proxy:8080. The form at the very end of a command is
        # the next rule, because a substring cannot say "end of line".
        - "-x test "
        - "--exclude-task test"

  - id: skip-verification-at-the-end
    description: Building with the test task excluded, as the last argument
    decision: ask
    reason: >-
      This builds without the tests that would have caught the problem. Fine for a
      quick local compile; not for anything that gets committed.
    match:
      kind: [shell]
      commandContains: *artefact-goals
      command:
        - "*gradle*-x test"
        - "*gradlew*-x test"
