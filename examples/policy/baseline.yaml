# Reeve baseline policy
#
# A starting point, not a finished policy. Every rule here is one an operator would
# have to justify anyway, and each one states why it exists so a blocked developer
# can tell whether the rule is wrong or their command is.
#
# Validate it:   reeve policy check examples/policy/baseline.yaml
# Try an action: reeve policy test examples/policy/baseline.yaml --command "rm -rf /"
#
# Rules are order-independent. Where several match, the strictest wins, so adding a
# rule can only ever tighten this policy.

version: 1
name: baseline
revision: "2026-09-18"

# Nothing is blocked unless a rule says so. A policy that denied everything it had
# not anticipated would stop all work on the first day.
default: allow

# Standing posture, pushed into each agent's own administrator-owned configuration by
# `reeve policy compile`. These keep holding when the guard is not running, which is
# why both layers are deployed together.
settings:
  # Without this, every rule below is advisory: a developer can start the agent in a
  # mode that skips all prompting and none of it applies.
  bypass: disabled
  approvalMode: prompt
  sandbox: required

  telemetry:
    endpoint: https://otel.example.internal:4318
    # `reeve collect` reads OTLP over HTTP with JSON encoding. Point this at any
    # OTLP endpoint you like; use http/json if that endpoint is the Reeve collector.
    protocol: http/json
    # Prompts and tool arguments routinely contain credentials and customer data.
    captureContent: false

  mcp:
    allow:
      - name: github
      - name: jira

  guard:
    enabled: true
    command: reeve
    log: /var/log/reeve/decisions.jsonl
    # Start here. Run for a week, read the log, fix the rules that fire on ordinary
    # work, and only then set this to false.
    dryRun: true

rules:
  # ---------------------------------------------------------------- secrets ----

  - id: read-secrets
    description: Reading credential files
    decision: deny
    reason: >-
      This file usually holds credentials. An agent that reads it can repeat the
      contents into a prompt, a commit or a tool call, and you would not see it
      happen. Read the value yourself and pass only what is needed.
    match:
      kind: [read]
      path:
        - "**/.env"
        - "**/.env.*"
        - "**/.ssh/**"
        - "**/.aws/credentials"
        - "**/.kube/config"
        - "**/id_rsa"
        - "**/id_ed25519"
        - "**/*.pem"
        - "**/*.p12"
        - "**/*.keystore"

  - id: print-secrets
    description: Printing credential files through a shell command
    decision: deny
    reason: >-
      Reading a credential file through the shell bypasses a file-read rule while
      having exactly the same effect.
    match:
      kind: [shell]
      commandContains:
        - ".env"
        - "id_rsa"
        - ".aws/credentials"
        - ".kube/config"

  # ------------------------------------------------------------ destructive ----

  - id: destructive-delete
    description: Recursive force delete
    decision: deny
    reason: >-
      A recursive force delete is unrecoverable and, when a path is wrong or a
      variable is empty, removes far more than intended.
    match:
      kind: [shell]
      commandContains:
        - "rm -rf"
        - "rm -fr"
        - "Remove-Item -Recurse -Force"

  - id: rewrite-history
    description: Rewriting history on a shared branch
    decision: ask
    reason: >-
      This rewrites history on a branch other people pull from. Confirm nobody else
      is working from it.
    # Narrowed to protected branches. Force-pushing your own feature branch is
    # routine and no longer prompts, including with --force-with-lease, which the
    # earlier rule punished despite it being the safer idiom.
    #
    # The two fields are combined with AND: a force-push form, and a protected
    # branch named in the command.
    #
    # Known gap: `git push --force` with an upstream already configured names no
    # branch, so it is not caught. Catching that needs the current branch, which is
    # not in the command line. Widening the rule to compensate would put us back
    # where we started.
    match:
      kind: [shell]
      command:
        - "*push*--force*"
        - "*push*-f *"
        - "*--force*push*"
      commandContains:
        - " main"
        - " master"
        - " develop"
        - " release"
        - "+main"
        - "+master"

  - id: history-rewrite-tools
    description: Rewriting history wholesale
    decision: ask
    reason: >-
      These rewrite every commit they touch. They are almost never part of ordinary
      work, so a prompt costs nothing and catching a mistake is worth a great deal.
    match:
      kind: [shell]
      commandContains:
        - "filter-branch"
        - "filter-repo"

  - id: discard-working-tree
    description: Discarding uncommitted work
    decision: ask
    reason: >-
      This throws away changes that are not committed anywhere, including work you
      may not have looked at yet.
    match:
      kind: [shell]
      commandContains:
        - "git checkout -- ."
        - "git clean -fd"
        - "git restore ."
        # Moved here from rewrite-history, where it never belonged: a hard reset
        # discards uncommitted work rather than rewriting published history. It is
        # left in place rather than narrowed because destroying work nobody has
        # committed is the most common way an agent loses something, and the command
        # line does not say whether there was any.
        - "reset --hard"

  # --------------------------------------------------------------- exposure ----

  - id: pipe-to-shell
    description: Downloading and executing a script in one step
    decision: deny
    reason: >-
      This runs code from the network without anyone reading it first. Download the
      script, read it, then run it.
    # The two fields are combined with AND: a downloader, and a pipe into a shell.
    #
    # This rule previously listed literal strings like "curl | bash", which never
    # matched anything: a real command is `curl https://x.sh | bash`, with the URL in
    # between. It read plausibly in review and caught nothing for as long as it
    # existed, which is the precise failure this project is meant to prevent.
    match:
      kind: [shell]
      command:
        - "*curl*"
        - "*wget*"
        - "*iwr*"
        - "*irm*"
        - "*invoke-webrequest*"
      commandContains:
        - "| sh"
        - "|sh"
        - "| bash"
        - "|bash"
        - "| zsh"
        - "| iex"
        - "|iex"

  - id: publish-package
    description: Publishing a package to a public registry
    decision: deny
    reason: >-
      Publishing is public and effectively permanent. This should be done by a
      release pipeline, not from a developer machine during a session.
    match:
      kind: [shell]
      commandContains:
        - "npm publish"
        - "twine upload"
        - "cargo publish"
        - "mvn deploy"
        - "gem push"

  # -------------------------------------------------------------- production ----

  - id: production-infrastructure
    description: Changing infrastructure that is explicitly production
    decision: ask
    reason: >-
      This command names a production target. Confirm it is the one you meant and
      that the change has been reviewed.
    # Narrowed from "any infrastructure command" to "an infrastructure command that
    # explicitly names production". The two fields are combined with AND.
    #
    # The earlier rule prompted on `kubectl apply --context kind-local` exactly as
    # hard as on a production cluster, because a command line does not say which
    # environment it reaches.
    #
    # Known gap, and it is a large one: this only fires when the target is named in
    # the command. Someone who ran `kubectl config use-context prod` earlier and then
    # types `kubectl delete` is not caught. Closing that properly needs a resource
    # registry mapping contexts, namespaces and workspaces to environments, resolved
    # at decision time. Until that exists this rule is a partial control, and is
    # worth having only because a false negative here costs less than a policy
    # everyone has muted.
    match:
      kind: [shell]
      command:
        - "*kubectl*"
        - "*terraform*"
        - "*helm*"
        - "*aws *"
        - "*gcloud*"
      commandContains:
        - "--context prod"
        - "--context production"
        - "--namespace prod"
        - "-n prod"
        - "prod.tfvars"
        - "production.tfvars"
        - "workspace select prod"

  # -------------------------------------------------------------------- mcp ----

  - id: unknown-mcp-server
    description: Calling an MCP server that is not on the approved list
    decision: ask
    reason: >-
      This server is not one the organisation has approved. Anything it can reach,
      the agent can now reach.
    match:
      kind: [mcp]
    # Replace this rule with explicit allow rules per approved server once your
    # list exists. Left as ask so the policy is usable before that work is done.
