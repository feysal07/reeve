# What a model costs, in US dollars per million tokens.
#
# Cost is computed centrally rather than taken from the agents. Two of the three
# supported agents report no cost at all, and the one that does reports list price,
# which is wrong for any organisation with negotiated rates. A number that means
# something different depending on which agent produced it cannot be summed.
#
# Keys match on the longest prefix, so a family can be priced once and one member
# overridden. A model with no entry is reported as unpriced rather than costed at
# zero, because zero is indistinguishable from free.

currency: USD

# Scale every computed cost, for an organisation that recharges at a rate other than
# the one it pays. 1 means charge what it costs.
multiplier: 1

models:
  claude-opus:
    input: 15
    output: 75
    cacheRead: 1.50
    cacheCreation: 18.75
  claude-sonnet:
    input: 3
    output: 15
    cacheRead: 0.30
    cacheCreation: 3.75
  gpt-5:
    input: 1.25
    output: 10
    cacheRead: 0.125

# ---------------------------------------------------------------------------
# How this organisation actually pays.
#
# Without this section every figure computed above is EQUIVALENT COST: what the
# usage would cost at these rates. That is a real measure of consumption and a
# sound basis for internal recharge, and it is not money leaving the
# organisation.
#
# Most people deploying this pay for seats in advance. A Claude Teams seat, a
# Copilot seat and a Cursor seat all include an allowance, so tokens inside that
# allowance are already paid for and their marginal cost is nothing. A report
# that says "$340 this week" to such an organisation is quoting a number that
# looks like money and is not — and a budget rule that stops somebody's work on
# the strength of it stops them for the wrong reason.
#
#   metered       every token is billed; consumption is marginal cost
#   subscription  seats bought in advance, with an included allowance
#   credits       a prepaid balance drawn down
#
# Leave an agent out and Reeve reports its marginal cost as not known, rather
# than assuming: metered overstates it for most organisations, and subscription
# understates it to nothing for the rest.
#
# What Reeve cannot know: the telemetry reports consumption, never "this request
# drew on credits rather than the allowance", and never which tier the person
# sitting at the keyboard is on. So an individual is reported as over only when
# they have passed even the largest seat you declare — the only claim the
# evidence supports — and the vendor's own console remains the place to read a
# credit balance.
billing:
  claude-code:
    model: subscription

    # What happens once an allowance is exhausted. This changes what being over
    # means: credits is a bill, throttled is lost time, blocked is an outage.
    #   credits | throttled | blocked
    overage: credits

    # The tiers you hold. Plural, because organisations mix them — most people
    # on a standard seat, a few on premium. One seats figure cannot say that,
    # and averaging the tiers produces an allowance nobody actually has.
    #
    # Name them whatever your purchase order calls them; the names are only
    # used to tell the tiers apart in this file.
    plans:
      teams-standard:
        seats: 24
        limits:
          # unit     what the vendor meters: tokens or requests
          # included how much of it this tier includes
          # per      seat, or organisation for a shared pool
          # period   how often it resets, as a Go duration
          # label    what to call it in the report, when a tier has several
          - unit: tokens
            included: 20000000
            per: seat
            period: "168h"
            label: weekly tokens

      teams-premium:
        seats: 1
        limits:
          - unit: tokens
            included: 100000000
            per: seat
            period: "168h"
            label: weekly tokens
          # A second window on the same tier. Several apply at once in practice,
          # and they run out at different times — declaring only the long one
          # means reporting comfortably on the window that is not the problem.
          - unit: tokens
            included: 2000000
            per: seat
            period: "5h"
            label: session tokens

    notes: Replace with your own tiers, seat counts and allowances.

  # An agent metered in requests rather than tokens. An allowance of 300
  # requests measured against token consumption reports several million per
  # cent; measured the other way it reports nothing. Declare what is metered.
  copilot-cli:
    model: subscription
    overage: blocked
    plans:
      business:
        seats: 25
        limits:
          - unit: requests
            included: 300
            per: seat
            period: "720h"
            label: monthly premium requests

  # An agent bought by the token. Here consumption really is spend.
  codex-cli:
    model: metered
