# What each environment actually consists of.
#
# This is what lets a policy say "production" and mean it. Without it, a rule can only
# match the text of a command, which catches the developer who typed `--context prod`
# and misses the one who ran `kubectl config use-context prod` an hour ago and is now
# typing `kubectl delete deploy api`. The second is the more dangerous case.
#
# Environments are checked in order and the first match wins, so put the strictest
# first: a name matching both production and development patterns is production.
#
# A target matching nothing is reported as "unknown", never assumed safe. A rule that
# wants to be cautious about those says `environment: [production, unknown]`.

version: 1

environments:
  - name: production
    description: Customer-facing systems
    kubernetes:
      contexts:
        - "prod"
        - "prod-*"
        - "*-prod"
        - "*production*"
        # Full ARNs, which is what a context is called when it comes from eksctl
        # or aws eks update-kubeconfig.
        - "arn:aws:eks:*:*:cluster/prod-*"
      namespaces:
        - "prod"
        - "prod-*"
        - "payments"
    terraform:
      workspaces:
        - "prod"
        - "production"
      varFiles:
        - "prod.tfvars"
        - "production.tfvars"
        - "prod.*.tfvars"

  - name: staging
    description: Pre-production, real data shapes but no customers
    kubernetes:
      contexts: ["staging", "staging-*", "*-staging", "preprod*"]
      namespaces: ["staging", "preprod"]
    terraform:
      workspaces: ["staging", "preprod"]
      varFiles: ["staging.tfvars", "preprod.tfvars"]

  - name: development
    description: Local and shared development
    kubernetes:
      contexts:
        - "kind-*"
        - "minikube"
        - "docker-desktop"
        - "rancher-desktop"
        - "dev"
        - "dev-*"
      namespaces: ["dev", "default", "local"]
    terraform:
      workspaces: ["dev", "default", "local"]
      varFiles: ["dev.tfvars", "local.tfvars"]

# MCP servers, and which environment a call to each one reaches.
#
# Without this, a Kubernetes MCP server is a second door into every cluster your
# kubeconfig can reach, and a production rule written about shell commands never sees
# what comes through it. Found on a real machine: pods listed and resources read
# through MCP, every call allowed without a prompt, while the rule looked configured.
#
# A server is identified by what it runs - the program's base name and its arguments,
# or its URL - and never by the name in the agent's configuration, which is a label the
# developer chose. The guard looks the definition up in the agent's own configuration,
# the same files `reeve scan` reads.
#
# A server not listed here is "unknown", never assumed harmless.
mcp:
  # A server that reaches whichever cluster its kubeconfig says. Each call is resolved
  # the way a kubectl command would be: the namespace or context from the call's own
  # arguments when it names one, and from the kubeconfig the server reads otherwise.
  - command: "npx -y kubernetes-mcp-server*"
    kubernetes:
      contextArg: context
      namespaceArg: namespace

  # A server bound to one place, such as a database MCP pointed at a replica.
  # - url: "https://db-mcp.internal.example/*"
  #   environment: production
