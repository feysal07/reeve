name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # Read the version from go.mod rather than pinning it here, so a
          # dependency raising its requirement cannot silently break CI.
          go-version-file: go.mod
          check-latest: true
      - name: Verify formatting
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
        shell: bash
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Build
        run: go build ./...

  # Both walkthroughs assert the same things about the same sandbox, in two
  # languages. Running each on the platform it is written for is what stops them
  # drifting apart in silence, which is the only real risk of keeping two.
  walkthrough:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            run: sh examples/walkthrough.sh --quiet
          - os: macos-latest
            run: sh examples/walkthrough.sh --quiet
          - os: windows-latest
            run: pwsh -File examples/walkthrough.ps1 -Quiet
    # Named explicitly. Without this the job takes its name from every matrix value,
    # command string included, so a required status check would be called
    # "walkthrough (ubuntu-latest, sh examples/walkthrough.sh --quiet)" and would
    # silently cease to exist the day that command changed. A branch rule waiting on a
    # check that no longer reports blocks every pull request and explains nothing.
    name: walkthrough (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Walk through every plane against a sandbox
        run: ${{ matrix.run }}

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.22.0

      - name: Lint
        run: helm lint --strict deploy/helm/reeve-collector

      - name: Render every supported shape
        run: |
          set -eu
          chart=deploy/helm/reeve-collector
          render() {
            echo "  rendering: $*"
            helm template t "$chart" "$@" > /dev/null
          }
          render
          render --set persistence.enabled=false
          render --set persistence.existingClaim=my-claim
          render --set collector.teams.existingConfigMap=cm --set collector.prices.existingConfigMap=cm
          render --set-file collector.teams.content=examples/telemetry/teams.yaml \
                 --set-file collector.prices.content=examples/telemetry/prices.yaml
          render --set service.type=NodePort --set service.nodePort=31318
          render --set networkPolicy.enabled=true
          render --set collector.metrics.enabled=false
          render --set serviceMonitor.enabled=true --set prometheusRule.enabled=true
          render --set networkPolicy.enabled=true --set serviceMonitor.enabled=true \
                 --set 'networkPolicy.scrapeFrom[0].namespaceSelector.matchLabels.kubernetes\.io/metadata\.name=monitoring'
          render --set ingress.enabled=true \
                 --set ingress.authenticatedByProxy=true \
                 --set ingress.tls[0].secretName=tls \
                 --set ingress.tls[0].hosts[0]=reeve.internal

      # The chart refuses configurations that would deploy cleanly and be wrong. A
      # refusal that stops refusing is a silent regression, so each one is asserted
      # rather than assumed.
      - name: Refuse what would be quietly wrong
        run: |
          set -eu
          chart=deploy/helm/reeve-collector
          refuses() {
            desc="$1"; shift
            if helm template t "$chart" "$@" > /dev/null 2>&1; then
              echo "REGRESSION: the chart accepted $desc"
              exit 1
            fi
            echo "  refused: $desc"
          }
          refuses "more than one replica" --set replicaCount=2
          refuses "an ingress with no TLS" --set ingress.enabled=true
          refuses "an ingress with no authentication in front of it" \
            --set ingress.enabled=true \
            --set ingress.tls[0].secretName=tls \
            --set ingress.tls[0].hosts[0]=reeve.internal
          refuses "a network policy that would deny the ingress controller" \
            --set ingress.enabled=true \
            --set ingress.authenticatedByProxy=true \
            --set ingress.tls[0].secretName=tls \
            --set ingress.tls[0].hosts[0]=reeve.internal \
            --set networkPolicy.enabled=true
          refuses "a network policy that would deny Prometheus" \
            --set networkPolicy.enabled=true --set serviceMonitor.enabled=true
          refuses "a ServiceMonitor selecting metrics that are switched off" \
            --set serviceMonitor.enabled=true --set collector.metrics.enabled=false
          refuses "alerts on metrics that are never published" \
            --set prometheusRule.enabled=true --set collector.metrics.enabled=false

      # An alert expression with a typo loads and then simply never fires, so the
      # rules are checked by the tool Prometheus itself ships.
      - name: Check the alert rules with promtool
        run: |
          set -eu
          helm template t deploy/helm/reeve-collector \
            --set prometheusRule.enabled=true \
            --show-only templates/prometheusrule.yaml \
            | python3 -c 'import sys,yaml; yaml.safe_dump(yaml.safe_load(sys.stdin)["spec"], open("rules.yaml","w"))'
          docker run --rm --entrypoint /bin/promtool \
            -v "$PWD/rules.yaml:/rules.yaml" \
            prom/prometheus:latest check rules /rules.yaml

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Build only. Publishing happens from the release workflow, on a tag.
      - name: Build the collector image
        run: docker build --build-arg VERSION=ci -t reeve:ci .
      - name: The binary in it must run
        run: docker run --rm reeve:ci version
