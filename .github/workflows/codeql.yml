# Static analysis, as a workflow rather than through the repository's Default setup.
#
# Two reasons for the file. The query suite is security-extended rather than the
# default set, which is a deliberate choice worth recording where it can be reviewed.
# And a workflow runs on pull requests from forks on the same terms as anything else,
# so a contributor sees the same result the maintainer does.
#
# Do not also enable Default setup in repository settings. The two conflict, and
# GitHub resolves that by disabling this one.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because a query added upstream can find something in code that has not
    # changed. Analysis that only runs on a commit never sees those.
    - cron: "37 4 * * 1"

permissions:
  contents: read

jobs:
  analyse:
    name: analyse (go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - uses: github/codeql-action/init@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          languages: go
          queries: security-extended

      - uses: github/codeql-action/autobuild@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: "/language:go"
