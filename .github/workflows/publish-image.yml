# Publishes the collector image to GitHub Container Registry.
#
# It never runs on its own. Pushing an image is a deliberate act. If you would rather
# have a floating build of main, add:
#
#   push:
#     branches: [main]
#
# and the `type=ref,event=branch` tag below will produce ghcr.io/<owner>/reeve:main.
name: Publish image

# A published release, and nothing else automatic.
#
# This listened for both a tag push and a release, on the reasoning that only one of
# them fires depending on how the release was made. Both fired on v0.1.0, and each
# built the image independently: same tags, different digests, with the second
# silently overwriting the first. Anyone who pulled between the two got an image that
# no longer exists under that tag. The tags were idempotent; the digests were not,
# because the build is not bit-reproducible.
#
# A missed publish is visible - there is no image. A tag whose digest changed under
# you is not. So this fires once, on the event that actually means "publish", and
# workflow_dispatch covers the case where it needs doing by hand.
on:
  workflow_dispatch:
  release:
    types: [published]

# Belt and braces: two runs for one version must never build concurrently.
concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository_owner }}/reeve
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      # Both architectures, because a cluster's nodes are not always the ones the
      # image was built on, and an image that only runs on amd64 fails at
      # scheduling time rather than at build time.
      - id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The same statement as the release binaries carry, for the image. It is bound to
      # the digest rather than the tag, because a tag is a label someone can move and a
      # digest is the thing that was actually built.
      - name: Sign what was pushed
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/reeve
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
