# Builds the binaries a release is actually for, and attaches them to it.
#
# Reeve is meant to be dropped on every developer machine and CI runner, so a release
# shipping only a container image asks a security team to install Go before they can
# run `reeve scan`. That is the first thing anyone does with this, and it should not
# require a toolchain.
#
# Run by hand, it builds and checks everything and keeps the result as a workflow
# artifact instead of publishing it, so the workflow can be proven before a release
# depends on it.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  # id-token and attestations are what the provenance step needs; neither grants
  # anything else, and nothing here can write to a package.
  id-token: write
  attestations: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Work out the version
        id: version
        run: |
          set -eu
          if [ "${{ github.event_name }}" = "release" ]; then
            version="${{ github.event.release.tag_name }}"
          else
            version="$(git describe --tags --always --dirty 2>/dev/null || echo dev)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "building $version"

      - name: Build every target
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          mkdir -p dist

          # Go cross-compiles, so one runner covers every target. arm64 is included
          # for Linux because CI fleets increasingly are not amd64, and a governance
          # tool that cannot run on the runner it is meant to gate is no use.
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            name="reeve-${goos}-${goarch}"
            out="dist/${name}"
            mkdir -p "$out"

            binary="$out/reeve"
            if [ "$goos" = "windows" ]; then
              binary="$out/reeve.exe"
            fi

            echo "  $target"
            # CGO off is what makes the result run on a machine that shares nothing
            # with this one. -trimpath keeps the builder's paths out of the binary,
            # so the same source produces the same bytes wherever it is built.
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build \
              -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$binary" ./cmd/reeve

            cp examples/policy/baseline.yaml "$out/baseline-policy.yaml"
            cp LICENSE "$out/LICENSE"

            # The package README is a tracked file rather than a heredoc in here, so
            # the first thing a stranger reads can be reviewed in a diff.
            sed "s/__VERSION__/${VERSION}/g" packaging/package-README.md > "$out/README.md"

            if [ "$goos" = "windows" ]; then
              (cd dist && zip -qr "${name}.zip" "${name}")
            else
              chmod +x "$binary"
              tar -czf "dist/${name}.tar.gz" -C dist "${name}"
            fi
            rm -rf "$out"
          done

          ls -l dist

      - name: The binary must run, and must know what it is
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          tar -xzf dist/reeve-linux-amd64.tar.gz -C /tmp
          got="$(/tmp/reeve-linux-amd64/reeve version)"
          echo "reported: $got"
          # A version stamp that silently failed to apply would ship a binary calling
          # itself "dev", and nothing it produced could be tied back to a release.
          case "$got" in
            *"${VERSION}"*)
              echo "version stamp matches the release"
              ;;
            *)
              echo "MISMATCH: built ${VERSION} but the binary reports '$got'"
              exit 1
              ;;
          esac

      - name: The packaged policy must be the one that ships
        run: |
          set -eu
          # A stale or unparseable policy in the download would have someone's first
          # command fail on a file this project put there.
          /tmp/reeve-linux-amd64/reeve policy check /tmp/reeve-linux-amd64/baseline-policy.yaml

      - name: Checksums
        run: |
          set -eu
          cd dist
          # This tool asks to be installed with elevated trust on every developer
          # machine. An unverifiable download is not a reasonable thing to ask for.
          sha256sum ./*.tar.gz ./*.zip > checksums.txt
          cat checksums.txt

      # Signed provenance: a statement that these exact files were produced by this
      # workflow, from this commit, on GitHub's runners. Checksums prove a download was
      # not corrupted in transit; they say nothing about who built it, and a checksums
      # file published beside the artifacts it describes is only as trustworthy as the
      # release it sits in. Verify with:
      #
      #   gh attestation verify reeve-linux-amd64.tar.gz --repo feysal07/reeve
      - name: Sign what was built
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: "dist/*.tar.gz, dist/*.zip"

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/*.tar.gz dist/*.zip dist/checksums.txt --clobber

      - name: Keep the build for inspection
        if: github.event_name != 'release'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reeve-binaries
          path: dist/
          retention-days: 7
