# Scrapes the collector's metrics listener, which is a different port from the one
# agents write to. Nothing here reaches outside the compose network.
global:
  scrape_interval: 30s

# Metrics without alerts are a dashboard nobody opens. See rules.yml for why these
# three and not others.
rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: reeve
    static_configs:
      - targets: ["collector:9090"]
