# The collector, Prometheus and Grafana, on one machine, in one command.
#
#   docker compose up -d
#
# then point an agent at it:
#
#   export OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4318
#   export OTEL_EXPORTER_OTLP_PROTOCOL=http/protobuf
#
# and open http://127.0.0.1:3000.
#
# The Helm chart in ../helm covers Kubernetes. This covers the case that comes first:
# one person, one machine, finding out whether any of this is worth deploying.
#
# ---------------------------------------------------------------------------
# Everything here is bound to 127.0.0.1 on purpose.
#
# The collector has no authentication. It cannot have any: it accepts OTLP from agents
# that have no way to present a credential this tool would recognise, which is why the
# Helm chart makes you assert that something in front of it is doing authentication
# before it will render. There is nothing in front of it here, so nothing outside this
# machine can reach it. Change "127.0.0.1:" to "0.0.0.0:" and you have published an
# unauthenticated write endpoint to your network.
#
# Agents send usage, not content. Prompts and responses are never stored, whatever an
# agent is configured to send — but team names, repository names, model names and
# spend all are, and that is worth keeping off a shared network.
# ---------------------------------------------------------------------------

name: reeve

services:
  # Docker creates a named volume owned by root, and the collector image runs as
  # nonroot because a process that accepts network input has no business being
  # root. Without this the collector cannot open its own event store and restarts
  # for ever, which is how this file was written the first time.
  #
  # It runs once, does one chown, and exits. Nothing else here runs as root.
  init:
    image: busybox:1.38
    user: root
    command: ["sh", "-c", "mkdir -p /var/lib/reeve && chown -R 65532:65532 /var/lib/reeve"]
    volumes:
      - events:/var/lib/reeve

  collector:
    image: ghcr.io/feysal07/reeve:0.4.0
    restart: unless-stopped
    command:
      - collect
      - --addr=0.0.0.0:4318
      - --store=/var/lib/reeve/events.jsonl
      - --teams=/etc/reeve/teams.yaml
      - --prices=/etc/reeve/prices.yaml
      # A listener of its own, so the port agents write to and the port your
      # monitoring reads from are not the same port.
      - --metrics-addr=0.0.0.0:9090
    ports:
      - "127.0.0.1:4318:4318"
    volumes:
      - events:/var/lib/reeve
      - ./config:/etc/reeve:ro
    depends_on:
      init:
        condition: service_completed_successfully
    # A single writer against a single file. Two collectors appending to one store
    # would interleave lines, so this does not scale by adding replicas, and the
    # Helm chart refuses to render more than one for the same reason.
    deploy:
      replicas: 1
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL

  prometheus:
    image: prom/prometheus:v3.1.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=90d
    ports:
      - "127.0.0.1:9091:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Mounted separately rather than as a directory: prometheus.yml names this path
      # in rule_files, and a missing rules file stops Prometheus at startup instead of
      # quietly running with no alerts.
      - ./config/rules.yml:/etc/prometheus/rules.yml:ro
      - prometheus:/prometheus
    depends_on:
      - collector

  grafana:
    image: grafana/grafana:11.5.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # No login on a localhost-only dashboard that reads a metrics store with no
      # identity in it. If you publish this port, set these back.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./config/grafana:/etc/grafana/provisioning:ro
      - grafana:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  events:
  prometheus:
  grafana:
