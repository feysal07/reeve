# Default values for reeve-collector.
#
# The collector receives what AI coding agents export over OTLP, normalises it
# across vendors, prices it at your rates and attributes it from a mapping you
# control. It writes one append-only file: an audit record of who did what.
#
# Two things about that file shape everything below. It is the record, so the
# volume it lives on outlives the release. And it is written by one process, so
# this chart runs exactly one replica; see `replicaCount`.

image:
  repository: ghcr.io/feysal07/reeve
  # Empty means the chart's appVersion, which is a released tag. To track main
  # instead of a release:
  #
  #   --set image.tag=main --set image.pullPolicy=Always
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# There is deliberately no way to run more than one.
#
# Each replica would open its own file, the Service would spread agents across
# them, and every report would be computed from whichever fraction of the events
# it happened to read. Nothing would error. The totals would just be wrong, and
# wrong quietly, which is the failure this project exists to catch.
#
# The template refuses to render if this is set above 1.
replicaCount: 1

collector:
  # The port the collector listens on inside the pod. 4318 is the OTLP/HTTP port
  # every exporter assumes, so changing it means configuring every agent.
  port: 4318

  # Log a line per batch received. Useful while proving agents are reaching the
  # collector; noisy afterwards.
  verbose: false

  # Team attribution. Resolved here rather than taken from the agents, because an
  # agent runs on a developer's machine and every attribute it sends is asserted
  # by that machine.
  #
  # Leave `content` empty and `existingConfigMap` unset to run without a mapping:
  # the collector starts, warns, and every event lands unattributed.
  teams:
    # Inline YAML, rendered into a ConfigMap. See examples/telemetry/teams.yaml.
    content: ""
    # Or the name of a ConfigMap you manage, which must hold a `teams.yaml` key.
    # This wins over `content` if both are set.
    existingConfigMap: ""

  # Your rates, in US dollars per million tokens. Without this the collector uses
  # a built-in table at published list prices, which is wrong for anyone with a
  # negotiated rate, and says so on startup.
  prices:
    content: ""
    existingConfigMap: ""

  # Prometheus metrics about the collector itself: what it received, what it wrote,
  # what it could not price, and how big the store has grown.
  #
  # These are served on a listener of their own, never on the port agents export to.
  # That port is usually reachable from every developer machine, and the metrics
  # there would tell anyone who asked which agents are in use and how much is being
  # spent. They also get their own ClusterIP Service, so making the agent-facing one
  # a LoadBalancer cannot take them along with it.
  #
  # No label carries an email, a session or a repository. See docs/TELEMETRY.md.
  metrics:
    enabled: true
    port: 9464

  # Extra arguments appended to the command, for a flag this chart does not model.
  extraArgs: []

persistence:
  # false replaces the volume with an emptyDir. The audit record is then deleted
  # with the pod. That is a reasonable way to try the chart out and not a
  # reasonable way to run it.
  enabled: true

  # Use a PersistentVolumeClaim you already created, instead of letting the
  # StatefulSet create one.
  existingClaim: ""

  # Empty means the cluster's default StorageClass.
  storageClass: ""
  accessModes:
    - ReadWriteOnce

  # Events are small, but nothing prunes them: the file only grows. Roughly
  # 300 bytes per event, so a thousand agent-sessions a day is on the order of a
  # gigabyte a year. Size for the retention you intend to keep, and see the
  # chart README on what to do when it fills.
  size: 10Gi

  mountPath: /var/lib/reeve
  storeFile: events.jsonl

  # Claims created by the StatefulSet are intentionally left behind by
  # `helm uninstall`. Deleting an audit trail should be a separate, deliberate act.

service:
  type: ClusterIP
  port: 4318
  annotations: {}
  # Only used when type is NodePort.
  nodePort: ""

# Agents run on developer machines, outside the cluster, so something has to let
# them in. An Ingress is the usual answer and it is off by default, because the
# collector has no authentication of its own: anything that can POST to it can
# write events, and a forged event is indistinguishable from a real one.
#
# To enable it you must supply TLS and confirm that authentication is enforced in
# front of the collector. The template refuses to render otherwise.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: reeve.internal
      paths:
        - path: /
          pathType: Prefix
  # Required when enabled. A plain-HTTP endpoint would carry identities and
  # repository names in the clear.
  tls: []
  #  - secretName: reeve-collector-tls
  #    hosts:
  #      - reeve.internal

  # Set to true to confirm that requests are authenticated before they reach the
  # collector, by mutual TLS, an OAuth2 proxy, an ingress auth annotation or a
  # service mesh. This is an assertion you are making, not something the chart
  # can check. It exists so that exposing an unauthenticated write endpoint has
  # to be a decision someone took, rather than a default they inherited.
  authenticatedByProxy: false

# Restrict which pods may reach the collector. Off by default because a policy
# with no rules denies everything, which would look like the collector breaking.
networkPolicy:
  enabled: false
  # Namespace and pod selectors permitted to send telemetry. An empty list with
  # the policy enabled means nothing in the cluster may reach it, which is
  # correct when agents come in through the Ingress instead.
  ingressFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: ci

  # Selectors permitted to scrape the metrics port. Kept separate from the senders
  # above, because letting Prometheus in is not a reason to let it write events.
  scrapeFrom: []
  #  - namespaceSelector:
  #      matchLabels:
  #        kubernetes.io/metadata.name: monitoring

# Scrape configuration for the Prometheus Operator. Off by default because it
# needs the operator's CRDs, and a chart that assumes them fails to install on a
# cluster that has plain Prometheus instead.
serviceMonitor:
  enabled: false
  interval: 60s
  scrapeTimeout: 10s
  labels: {}
  relabelings: []
  metricRelabelings: []

# Alerts, as a PrometheusRule. Also off by default, and for the same reason.
#
# Metrics without alerts are a dashboard nobody opens. The two that matter are
# the ones a person cannot notice on their own: a collector that has quietly
# stopped receiving, and a volume filling towards the point where it stops.
prometheusRule:
  enabled: false
  labels: {}
  # How long, in seconds, the store may go unwritten before the audit trail is
  # called quiet. Seconds rather than a duration string because the expression is
  # PromQL arithmetic, not a Prometheus duration literal.
  #
  # Set it above the longest gap you expect outside working hours. An alert that
  # fires every night is an alert that gets silenced, and a silenced quiet-trail
  # alert is worse than none: it looks like coverage.
  quietForSeconds: 21600
  # Fraction of the store volume still free below which to warn. Needs kubelet
  # metrics, which kube-prometheus-stack scrapes by default.
  volumeFreeBelow: 0.15
  # How long an allowance may sit at zero consumption before it is called silent.
  #
  # A day, because that is long enough to clear a weekend of one team not working and
  # short enough to catch the real case: an agent whose telemetry never reaches the
  # allowance at all, which otherwise reads as nought per cent indefinitely.
  allowanceSilentFor: 24h
  # Pace above which an allowance is called on course to run out. 1 means exactly on
  # track to finish the window as it resets. Raise it if a bursty week is normal;
  # below 1 it fires on any use at all in the first hours of a period.
  paceAbove: 1

serviceAccount:
  create: true
  annotations: {}
  name: ""

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    # No CPU limit by default: throttling the collector makes agents retry, which
    # makes it slower still. Memory is capped because a request body is bounded
    # but concurrency is not.
    memory: 256Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
priorityClassName: ""

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  # The store is created by the container user; fsGroup makes the mounted volume
  # writable by it without the image running as root.
  fsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

tests:
  # `helm test` needs a client to make a request with, and the collector's own
  # image has no shell to make one from. Point this at your mirror if the
  # cluster cannot pull from Docker Hub.
  image: busybox:1.38
