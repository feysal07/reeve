{{- include "reeve-collector.validate" . -}}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "reeve-collector.fullname" . }}
  labels:
    {{- include "reeve-collector.labels" . | nindent 4 }}
spec:
  # A StatefulSet rather than a Deployment because the pod owns a piece of
  # durable state. It also gives the right rollout behaviour for a single writer:
  # the old pod is gone, and its file closed, before the new one starts.
  replicas: 1
  serviceName: {{ include "reeve-collector.fullname" . }}-headless
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "reeve-collector.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- if or .Values.collector.teams.content .Values.collector.prices.content .Values.podAnnotations }}
      annotations:
        # Roll the pod when the mapping or the price table changes. Without this
        # a `helm upgrade` that edits teams.yaml would report success while the
        # running collector carried on attributing events the old way.
        {{- if .Values.collector.teams.content }}
        checksum/teams: {{ .Values.collector.teams.content | sha256sum }}
        {{- end }}
        {{- if .Values.collector.prices.content }}
        checksum/prices: {{ .Values.collector.prices.content | sha256sum }}
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- end }}
      labels:
        {{- include "reeve-collector.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "reeve-collector.serviceAccountName" . }}
      # The collector reads no Kubernetes API, so it is given no credential to do so.
      automountServiceAccountToken: false
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Long enough for an in-flight batch to finish and the file to be closed.
      terminationGracePeriodSeconds: 30
      containers:
        - name: collector
          image: {{ include "reeve-collector.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args:
            - collect
            # 0.0.0.0, not the binary's default of 127.0.0.1, which would bind
            # inside the pod's own namespace and reject everything else.
            - --addr=0.0.0.0:{{ .Values.collector.port }}
            - --store={{ include "reeve-collector.storePath" . }}
            {{- if .Values.collector.metrics.enabled }}
            - --metrics-addr=0.0.0.0:{{ .Values.collector.metrics.port }}
            {{- end }}
            {{- if include "reeve-collector.teamsConfigMap" . }}
            - --teams=/etc/reeve/teams/teams.yaml
            {{- end }}
            {{- if include "reeve-collector.pricesConfigMap" . }}
            - --prices=/etc/reeve/prices/prices.yaml
            {{- end }}
            {{- if .Values.collector.verbose }}
            - --verbose
            {{- end }}
            {{- with .Values.collector.extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: otlp-http
              containerPort: {{ .Values.collector.port }}
              protocol: TCP
            {{- if .Values.collector.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.collector.metrics.port }}
              protocol: TCP
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: otlp-http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: otlp-http
            initialDelaySeconds: 10
            periodSeconds: 20
            # Generous, because a restart drops whatever batches were in flight.
            failureThreshold: 6
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: store
              mountPath: {{ .Values.persistence.mountPath }}
            {{- if include "reeve-collector.teamsConfigMap" . }}
            - name: teams
              mountPath: /etc/reeve/teams
              readOnly: true
            {{- end }}
            {{- if include "reeve-collector.pricesConfigMap" . }}
            - name: prices
              mountPath: /etc/reeve/prices
              readOnly: true
            {{- end }}
      {{- if or (not .Values.persistence.enabled) .Values.persistence.existingClaim (include "reeve-collector.teamsConfigMap" .) (include "reeve-collector.pricesConfigMap" .) }}
      volumes:
        {{- if not .Values.persistence.enabled }}
        - name: store
          emptyDir: {}
        {{- else if .Values.persistence.existingClaim }}
        - name: store
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim }}
        {{- end }}
        {{- if include "reeve-collector.teamsConfigMap" . }}
        - name: teams
          configMap:
            name: {{ include "reeve-collector.teamsConfigMap" . }}
        {{- end }}
        {{- if include "reeve-collector.pricesConfigMap" . }}
        - name: prices
          configMap:
            name: {{ include "reeve-collector.pricesConfigMap" . }}
        {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
  volumeClaimTemplates:
    - metadata:
        name: store
        # Only the stable labels. A StatefulSet's volumeClaimTemplates cannot be
        # changed after creation, so putting the chart version here would make
        # every future `helm upgrade` fail on a field nobody meant to edit.
        labels:
          {{- include "reeve-collector.selectorLabels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        {{- if .Values.persistence.storageClass }}
        storageClassName: {{ .Values.persistence.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size }}
  {{- end }}
