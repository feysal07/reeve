{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "reeve-collector.serviceAccountName" . }}
  labels:
    {{- include "reeve-collector.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# No RBAC accompanies this account. The collector talks to no Kubernetes API, so
# it holds no permission to do so, and the token is not mounted into the pod.
automountServiceAccountToken: false
{{- end }}
