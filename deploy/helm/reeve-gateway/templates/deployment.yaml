{{- include "reeve-gateway.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "reeve-gateway.fullname" . }}
  labels:
    {{- include "reeve-gateway.labels" . | nindent 4 }}
spec:
  # Stateless: replicas coordinate through Postgres, and migrations serialise on an
  # advisory lock, so a rolling update loses nothing.
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "reeve-gateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "reeve-gateway.selectorLabels" . | nindent 8 }}
      annotations:
        # A config change rolls the pods; the gateway reads gateway.yaml at boot only.
        checksum/config: {{ include "reeve-gateway.config" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "reeve-gateway.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          {{- if .Values.image.digest }}
          image: "{{ .Values.image.repository }}@{{ .Values.image.digest }}"
          {{- else }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["gateway", "--config", "/etc/claude/gateway.yaml"]
          ports:
            - name: http
              containerPort: {{ .Values.gateway.listen.port | default 8080 }}
              protocol: TCP
          env:
            - name: CLAUDE_CONFIG_DIR
              value: {{ .Values.stateDir | quote }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/claude
              readOnly: true
            - name: state
              mountPath: {{ .Values.stateDir }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "reeve-gateway.fullname" . }}
        - name: state
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
