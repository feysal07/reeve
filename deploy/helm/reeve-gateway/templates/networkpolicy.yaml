{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "reeve-gateway.fullname" . }}
  labels:
    {{- include "reeve-gateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "reeve-gateway.selectorLabels" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
      ports:
        - port: http
          protocol: TCP
  egress:
    # Name resolution, without which nothing below resolves.
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- toYaml .Values.networkPolicy.egressTo | nindent 4 }}
{{- end }}
