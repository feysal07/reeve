# Published vulnerabilities in the agents Reeve scans, by the version that fixed them.
#
# Every entry has a source that was read, not remembered: the advisory database page
# that states the affected range. An entry written from a summary is how the planning
# notes for this project came to describe CVE-2026-54316 as a command-validator bypass,
# when the advisory says it is a WebFetch pre-approval of huggingface.co.
#
# reviewed is the date somebody last checked these sources for new advisories. scan says
# when it is old, because a table nobody has updated reads exactly like an agent with no
# known vulnerabilities.
#
# An advisory with no fixed version is left out: a minimum version cannot be checked
# against nothing, and flagging every installation would be a finding people learn to
# scroll past.
reviewed: 2026-10-01

advisories:
  - id: CVE-2026-54316
    ghsa: GHSA-fg94-h982-f3mm
    agent: claude-code
    title: Out-of-band data exfiltration via the pre-approved huggingface.co domain in WebFetch
    severity: critical
